<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#dfbe7d" />
      <stop offset="50%" stop-color="#c5a059" />
      <stop offset="100%" stop-color="#967635" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@800&amp;display=swap');
    .letter-v {
      font-family: 'Playfair Display', 'Times New Roman', Georgia, serif;
      font-size: 380px;
      font-weight: 800;
      fill: url(#goldGrad);
      filter: drop-shadow(0px 8px 20px rgba(0, 0, 0, 0.8));
    }
  </style>
  <!-- Obsidian Black Luxury Background Base -->
  <rect width="512" height="512" rx="120" fill="#080808" />
  <!-- Subtle Inner Metallic Gold Frame -->
  <rect x="18" y="18" width="476" height="476" rx="102" fill="none" stroke="url(#goldGrad)" stroke-width="12" stroke-opacity="0.55" filter="url(#glow)" />
  <!-- Stately Editorial 'V' Emblem -->
  <text x="256" y="380" text-anchor="middle" class="letter-v">V</text>
</svg>